openapi: 3.1.0
info:
  title: Ship24 Tracking ➕ API for per-call plans ➕ API for per-call plans ➕ API for per-call plans API
  description: '## Getting started


    Make sure to read the [Getting started](https://docs.ship24.com/getting-started) section of our [API Documentation](https://docs.ship24.com/) before using the endpoints presented below.

    ## Documentation structure


    Use the top navigation bar to switch from:


    - Our [API Documentation](https://docs.ship24.com/), which contains a comprehensive explanation of how our API works.

    - Our [API Reference](https://docs.ship24.com/tracking-api-reference/), which contains the specification of each of our endpoints.

    - Our [Support](https://docs.ship24.com/support/introduction) section, which contains help articles for most of the common questions and issues you may encounter.


    ## Import our documentation into your HTTP client


    Our API Reference is available as an Open API 3.1 format file, which is supported by most HTTP clients.


    - Latest version: https://docs.ship24.com/assets/openapi/ship24-tracking-api.yaml


    | <!-- -->                                                     | <!-- -->                                                                                                                                                     |

    | ------------------------------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------ |

    | ![Postman](/img/postman-logo.svg) Postman                    | In Postman, click on "Import", go on the "Link" tab, and paste this URL `https://docs.ship24.com/assets/openapi/ship24-tracking-api.yaml`                           |

    | <img src="/img/insomnia-logo.png" width="32"></img> Insomnia | From Insomnia preferences, locate the "Import data" option, choose "From URL", and paste this URL `https://docs.ship24.com/assets/openapi/ship24-tracking-api.yaml` |'
  version: 1.0.0
  contact:
    name: Ship24
    url: https://www.ship24.com/contact-us
servers:
- url: https://api.ship24.com
tags:
- name: ➕ API for per-call plans
  description: 'The **Tracking API (Per-call Plans)** is a specific product and associated endpoint on which usage is measured per API Call made. Each API call is synchronously fetching data from couriers which make it slower and more depend on courier''s system availability.


    Our standard "Per-shipment" product & plans remain the best choice as it offers more features, allow faster tracking information fetching with less dependency on courier''s system availability at a lower cost overall.


    > ⚠ You need an active "Per-call" subscription to use this endpoint.'
paths:
  /public/v1/tracking/search:
    post:
      tags:
      - ➕ API for per-call plans
      summary: Get tracking results by tracking number
      description: "This endpoint will return the `tracking` corresponding to the tracking number provided as a parameter. \n\nThe `tracking` object is detailed in the [SCHEMAS](/schemas/tracking) section.\n\nFor better accuracy, we strongly advise to provide extra information such as the origin country, destination postcode & country, and the shipping date.\n\n> \U0001F6D1 You need an active \"Per-call\" subscription to use this endpoint. Our standard \"Per-shipment\" product & plans remain the best choice as it offers more features, allow faster tracking information fetching with less dependency on courier's system availability at a lower cost overall.\n\n\n> \U0001F6D1 As this endpoint is synchronously fetching tracking results from couriers, **response time may be up to 1 minute, and results depend on the courier's system availability** at the time of the call."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trackingNumber:
                  type: string
                  minLength: 5
                  maxLength: 50
                  example: '9400115901047177598206'
                  pattern: ^[a-zA-Z0-9-_/.]*$
                  description: Tracking number of the shipment.
                originCountryCode:
                  type: string
                  example: CN
                  description: Sender country code - 📌 Recommended to improve tracking accuracy
                  format: ISO 3166-1 alpha-2/alpha-3
                destinationCountryCode:
                  type: string
                  example: US
                  description: Recipient country code - 📌 Recommended to improve tracking accuracy
                  format: ISO 3166-1 alpha-2/alpha-3
                destinationPostCode:
                  type: string
                  example: '94901'
                  description: Recipient Post code (or ZIP code) - 📌 Recommended to improve tracking accuracy
                shippingDate:
                  type: string
                  examples:
                  - '2021-03-01T11:09:00.000Z'
                  - '2021-03-01'
                  - '2021-03-01T11:09:00'
                  - '2021-03-01T11:09:00+02:00'
                  description: 'Date at which the shipment has been shipped  - 📌 Recommended to improve tracking accuracy: providing the shipping date helps us accurately identify the shipment and improves our ability to retrieve the correct data. However, an inaccurate shipping date could cause our system to exclude the right shipment. Therefore, please ensure the provided shipping date aligns closely with the actual shipment date, give or take a few days. [Format](http://docs.ship24.com/data-format#logistics-date-and-time)'
                  format: date-time
                courierCode:
                  type:
                  - array
                  - string
                  description: Code of the courier(s) handling the shipment (Up to 3 max) (see Couriers list section)  - 📌 Recommended to improve tracking accuracy
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json; charset=utf-8
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer your_api_key
        description: Your `api_key` prefixed with `Bearer`.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      trackings:
                        type: array
                        items:
                          type: object
                          properties:
                            shipment:
                              $ref: '#/components/schemas/shipment'
                            events:
                              type: array
                              items:
                                $ref: '#/components/schemas/event'
                            statistics:
                              $ref: '#/components/schemas/statistics'
              examples:
                Success:
                  value:
                    data:
                      trackings:
                      - shipment:
                          shipmentId: f4f888d7-d140-423f-9a48-e0689d27e098
                          statusCode: delivery_delivered
                          statusCategory: delivery
                          statusMilestone: delivered
                          originCountryCode: US
                          destinationCountryCode: CN
                          delivery:
                            estimatedDeliveryDate: 2025-03-04 18:00:00
                            courierEstimatedDeliveryDate:
                              from: 2025-03-04 17:00:00
                              to: 2025-03-04 18:00:00
                            service: null
                            signedBy: null
                          trackingNumbers:
                          - tn: '9400115901047177598206'
                          - tn: '9400111202544843610364'
                          recipient:
                            name: null
                            address: null
                            postCode: '94901'
