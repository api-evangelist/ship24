apis:
- aid: ship24:ship24-api-for-per-call-plans-api
  name: Ship24 ➕ API for per-call plans API
  description: >-
    The **Tracking API (Per-call Plans)** is a specific product and associated endpoint on which usage
    is measured per API Call made. Each API call is synchronously fetching data from couriers which make
    it slower and more depend on courier's system availability.


    Our standard "Per-shipment" product & plans remain the best choice as it offers more features, allow
    faster tracking information fetching with less dependency on courier's system availability at a lower
    cost overall.


    > ⚠ You need an active "Per-call" subscription to use this endpoint.
  humanURL: https://docs.ship24.com/
  baseURL: https://api.ship24.com
  tags:
  - ➕ API for per-call plans
