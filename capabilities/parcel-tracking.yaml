apiVersion: naftiko.dev/v1
kind: CapabilityComposition
metadata:
  name: parcel-tracking
  provider: Ship24
  api: Ship24 Tracking API
  description: |
    End-to-end parcel tracking workflow: create a tracker for an outbound
    shipment, receive webhook updates as the parcel moves, and pull a
    normalized event timeline for display on a branded tracking page.
spec:
  workflow:
    - step: create-tracker
      capability: ship24-trackers
      operation: create-tracker
    - step: receive-events
      capability: ship24-webhooks
      operation: receive-webhooks-tracking-results
    - step: render-timeline
      capability: ship24-tracking-results
      operation: get-tracking-results-of-tracker-by-trackerId
    - step: replay-on-incident
      capability: ship24-webhooks
      operation: resend-webhooks
      condition: subscriber endpoint missed events during an incident window
  governance:
    auth: bearer_api_key
    billable: yes
    billing_metric: shipment
